name: JalCheck CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend & Database Verification
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx

    - name: Verify Database Integrity (110 Samples, 11 Areas)
      run: |
        python -c "
        from backend.app.database.models import init_db
        from backend.data.seed_data import seed
        from backend.app.database.connection import get_db_connection
        init_db()
        seed()
        conn = get_db_connection()
        cur = conn.cursor()
        cur.execute('SELECT COUNT(*) FROM water_samples')
        samples = cur.fetchone()[0]
        cur.execute('SELECT COUNT(*) FROM areas')
        areas = cur.fetchone()[0]
        assert samples == 110, f'Expected 110 samples, got {samples}'
        assert areas == 11, f'Expected 11 areas, got {areas}'
        print(f'Database verified: {samples} samples across {areas} areas.')
        "

    - name: Run API Endpoints & Health Check Tests
      run: |
        python tests/test_ci.py

    - name: Verify Render Deployment Configuration
      run: |
        test -f Procfile && echo 'Procfile exists'
        test -f render.yaml && echo 'render.yaml exists'
        test -f Dockerfile && echo 'Dockerfile exists'